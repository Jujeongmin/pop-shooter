<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>POP Shooter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Do Hyeon은 게임 안에 직접 넣음 (public/fonts, OFL): Google Fonts는 글자 묶음 93개로 나눠 받아 iframe·느린 폰에서 일부 글자만 다른 글꼴로 그려졌음 -->
    <link rel="preload" href="./fonts/DoHyeon-core.woff2" as="font" type="font/woff2" crossorigin />
    <!-- HUD 아이콘·초상 묶음: 게임 코드와 같이 받기 시작 (src/ui/uiPack.ts) -->
    <link rel="preload" href="./ui/ui.pack" as="fetch" crossorigin />
    <script>
      // 첫 방문(이 기기에 저장이 없음 = 기본 캐릭터·시작 권총): 게임 코드를 받는 동안 캐릭터·총·블록도 같이 받기 시작.
      // 파일 이름은 src/config/characters.ts(blue)·gameConfig.ts(pistol)·world/kit.ts와 같아야 함 (tests/assets/preload.test.ts가 확인)
      try {
        if (!localStorage.getItem('popshooter.lastAccount') && !localStorage.getItem('popshooter.save')) {
          ['assets/models/character_blue_beanie_t1kq.glb', 'assets/models/pop_battle_pistol_lod1w.glb',
            'assets/kits/brick/bevel-lq-brick-2x4.glb', 'assets/kits/brick/bevel-lq-brick-2x2.glb', 'assets/kits/brick/bevel-lq-brick-1x2.glb',
            'assets/kits/brick/bevel-lq-brick-slope-2x4.glb', 'assets/kits/brick/bevel-lq-plate-4x8.glb', 'assets/kits/brick/bevel-lq-brick-1x1-round.glb',
          ].forEach(function (path) {
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'fetch';
            l.crossOrigin = 'anonymous';
            l.href = './' + path;
            document.head.appendChild(l);
          });
        }
      } catch (e) { /* 저장소가 막힌 iframe: 미리 받기 없이 그대로 */ }
    </script>
    <!-- Verse8: iframe이 게임 크기를 물어봄 (지우지 말 것) -->
    <script>
      (function () {
        function reportGameSize() {
          var height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          var width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
          window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE', height: height, width: width }, '*');
        }
        window.addEventListener('load', reportGameSize);
        window.addEventListener('resize', reportGameSize);
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') reportGameSize();
        });
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
