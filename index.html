<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>POP Shooter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Do Hyeon은 게임 안에 직접 넣음 (public/fonts, OFL): Google Fonts는 글자 묶음 93개로 나눠 받아 iframe·느린 폰에서 일부 글자만 다른 글꼴로 그려졌음 -->
    <link rel="preload" href="./fonts/DoHyeon-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Verse8: iframe이 게임 크기를 물어봄 (지우지 말 것) -->
    <script>
      (function () {
        function reportGameSize() {
          var height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          var width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
          window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE', height: height, width: width }, '*');
        }
        window.addEventListener('load', reportGameSize);
        window.addEventListener('resize', reportGameSize);
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') reportGameSize();
        });
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
